[metadata]
requires-python = ">=3.8"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freenode"
version = "0.0.1"
description = "Universal Platform Bypass Framework - Detect & Bypass Free Tier Limitations"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "macmam1", email = "contact@example.com"},
]
keywords = ["platform-bypass", "free-tier", "keepalive", "tunnel", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "click>=8.0.0",
    "psutil>=5.8.0",
    "requests>=2.26.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.20.0",
    "pydantic>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]

[project.urls]
Repository = "https://github.com/macmam1/freenode"
Issues = "https://github.com/macmam1/freenode/issues"
Documentation = "https://github.com/macmam1/freenode/wiki"

[project.scripts]
freenode = "cli:cli"

[tool.setuptools]
packages = ["src", "src.core", "src.modules"]
